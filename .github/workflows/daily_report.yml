name: Daily Stock Strategy Report

on:
  schedule:
    # 每个交易日北京时间 19:30 (UTC 11:30) 盘后运行
    - cron: '30 11 * * 1-5'  # UTC Mon-Fri 11:30 = 北京时间 Mon-Fri 19:30
  workflow_dispatch:  # 支持手动触发

env:
  TZ: Asia/Shanghai

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 缓存数据文件（pkl和CSV），避免每次重新下载全量数据
      - name: Restore data cache
        uses: actions/cache@v4
        id: data-cache
        with:
          path: |
            data/mainboard_clean.pkl
            data/features.pkl
            data/predictions.pkl
            data/.last_date.txt
            data/Stock_dailyK_*.csv
            data/.download_status.txt
          key: stock-data-v1-${{ github.run_number }}
          restore-keys: stock-data-v1-

      - name: Check if trading day
        id: check-trading-day
        run: |
          python -c "
          from datetime import datetime
          today = datetime.now()
          # 简单判断：周末不是交易日
          if today.weekday() >= 5:
              print('is_trading_day=false')
          else:
              print('is_trading_day=true')
          " >> "$GITHUB_OUTPUT"

      - name: Run daily pipeline
        if: steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          # 记录当前日期供邮件主题使用
          echo "REPORT_DATE=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"

          echo "===== Step 1: Update data ====="
          # 首次运行（无缓存）用全量下载，后续运行用增量更新
          if [ -d "data" ] && [ -n "$(ls -1 data/Stock_dailyK_*.csv 2>/dev/null)" ]; then
            echo "检测到现有CSV数据，使用增量更新模式"
            python src/py00_fetch_stock_data.py
          else
            echo "首次运行或无CSV数据，使用全量下载模式"
            python src/py00_fetch_stock_data.py
          fi

          echo "===== Step 2: Clean data ====="
          python src/py01_data_loader.py --date $(date +%Y-%m-%d)

          echo "===== Step 3: Feature engineering ====="
          python src/py02_features.py --date $(date +%Y-%m-%d)

          echo "===== Step 4: Single-day prediction ====="
          python src/py03_model.py --date $(date +%Y-%m-%d)

          echo "===== Step 5: Generate strategy ====="
          python src/py04_today.py

      # 将 Markdown 策略报告转为 HTML（供邮件发送）
      - name: Convert strategy report to HTML
        if: steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install markdown
          python - <<'PYEOF'
          import markdown, pathlib
          md_text = pathlib.Path("output/trading_strategy.md").read_text(encoding="utf-8")
          html_body = markdown.markdown(md_text, extensions=["tables", "sane_lists"])
          full_html = f"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"><style>
          body {{ font-family: -apple-system, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; line-height: 1.6; }}
          h1 {{ color: #c0392b; border-bottom: 2px solid #c0392b; padding-bottom: 8px; }}
          h2 {{ color: #2c3e50; margin-top: 24px; }}
          table {{ border-collapse: collapse; width: 100%; margin: 16px 0; }}
          th, td {{ border: 1px solid #ddd; padding: 8px 12px; text-align: left; }}
          th {{ background: #f5f5f5; font-weight: 600; }}
          tr:nth-child(even) {{ background: #fafafa; }}
          blockquote {{ border-left: 4px solid #e74c3c; margin: 16px 0; padding: 8px 16px; background: #fdf2f2; }}
          hr {{ border: none; border-top: 1px solid #eee; margin: 24px 0; }}
          em {{ color: #888; }}
          strong {{ color: #222; }}
          </style></head><body>{html_body}</body></html>"""
          pathlib.Path("output/trading_strategy.html").write_text(full_html, encoding="utf-8")
          print("✓ HTML email generated: output/trading_strategy.html")
          PYEOF

      # 邮件推送报告（支持多个收件人，用逗号分隔）
      - name: Send email notification
        if: (steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch') && env.EMAIL_RECIPIENT != ''
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '股票策略日报 - ${{ env.REPORT_DATE }}'
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.EMAIL_SENDER_NAME && format('{0} <{1}>', secrets.EMAIL_SENDER_NAME, secrets.EMAIL_USERNAME) || secrets.EMAIL_USERNAME }}
          html_body: file://output/trading_strategy.html

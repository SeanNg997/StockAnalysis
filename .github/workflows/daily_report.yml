name: Daily Stock Strategy Report

on:
  schedule:
    # 每个交易日北京时间 8:00 (UTC 00:00) 运行
    # baostock 数据T+1延迟，8点已可获取前一交易日数据
    - cron: '0 0 * * 1-5'  # UTC 每个工作日 00:00 = 北京时间 每个工作日 8:00
  workflow_dispatch:  # 支持手动触发

env:
  TZ: Asia/Shanghai

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 缓存数据文件（pkl和CSV），避免每次重新下载全量数据
      - name: Restore data cache
        uses: actions/cache@v4
        id: data-cache
        with:
          path: |
            data/mainboard_clean.pkl
            data/features.pkl
            data/predictions.pkl
            data/.last_date.txt
            data/Stock_dailyK_*.csv
            data/.download_status.txt
          key: stock-data-cache
          restore-keys: stock-data-

      - name: Check if trading day
        id: check-trading-day
        run: |
          python -c "
          from datetime import datetime
          today = datetime.now()
          # 简单判断：周末不是交易日
          if today.weekday() >= 5:
              print('is_trading_day=false')
          else:
              print('is_trading_day=true')
          " >> "$GITHUB_OUTPUT"

      - name: Run daily pipeline
        if: steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          echo "===== Step 1: Update data ====="
          # 首次运行（无缓存）用全量下载，后续运行用增量更新
          if [ -d "data" ] && [ -n "$(ls -1 data/Stock_dailyK_*.csv 2>/dev/null)" ]; then
            echo "检测到现有CSV数据，使用增量更新模式"
            python src/py00_fetch_stock_data.py --update
          else
            echo "首次运行或无CSV数据，使用全量下载模式"
            python src/py00_fetch_stock_data.py
          fi

          echo "===== Step 2: Clean data ====="
          python src/py01_data_loader.py

          echo "===== Step 3: Feature engineering ====="
          python src/py02_features.py

          echo "===== Step 4: Full model training and prediction ====="
          python src/py03_model.py

          echo "===== Step 5: Generate strategy ====="
          python src/py05_today.py

      - name: Commit and push report
        if: steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 归档策略报告（按日期命名）
          DATE=$(date +%Y-%m-%d)
          mkdir -p output/history
          cp output/today_strategy.txt "output/history/strategy_${DATE}.txt"
          git add output/today_strategy.txt "output/history/strategy_${DATE}.txt"
          git diff --cached --quiet || git commit -m "daily report: ${DATE}"
          git push

      # 邮件推送报告
      - name: Send email notification
        if: (steps.check-trading-day.outputs.is_trading_day == 'true' || github.event_name == 'workflow_dispatch') && env.EMAIL_RECIPIENT != ''
        env:
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.EMAIL_SERVER }}
          server_port: ${{ secrets.EMAIL_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: '股票策略日报 - ${{ github.run_id }}'
          to: ${{ secrets.EMAIL_RECIPIENT }}
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            A股量化交易策略日报
            ======================

            执行时间: $(date '+%Y-%m-%d %H:%M:%S')

            策略报告详情:
            ${{ env.REPORT_CONTENT }}
          html_body: file://output/today_strategy.txt
